[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deathpwn"
version = "0.1.0"
description = "Natural-language bug bounty / pentest runner — describe the attack in English, watch it run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeathPWN" }]
keywords = ["bug-bounty", "pentest", "subdomain", "subfinder", "ollama", "functiongemma"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/DeathPWN/deathpwn"

[project.scripts]
deathpwn = "deathpwn.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["deathpwn"]
